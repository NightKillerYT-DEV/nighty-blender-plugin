# SPDX-License-Identifier: GPL-3.0-or-later
schema_version = "1.0.0"

id = "nighty_blender"
name = "Nighty Blender"
tagline = "Make your imported models game-ready with the AI in Nighty Vault"
version = "2.0.1"
type = "add-on"
tags = ["3D View", "Modeling", "Pipeline"]
blender_version_min = "4.2.0"
maintainer = "NightyCode"
website = "https://github.com/NightKillerYT-DEV/nighty-blender-plugin"
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 NightyCode"]

# xatlas 0.0.11 (MIT, mworchel/xatlas-python): UV charts + packing for imported and decimated meshes. Blender
# installs the
# wheel that fits this system; it is run in Blender's python.exe, never imported inside Blender (see nighty/mesh/xa.py).
wheels = [
  "./wheels/xatlas-0.0.11-cp311-cp311-macosx_10_14_x86_64.whl",
  "./wheels/xatlas-0.0.11-cp311-cp311-macosx_11_0_arm64.whl",
  "./wheels/xatlas-0.0.11-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl",
  "./wheels/xatlas-0.0.11-cp311-cp311-win_amd64.whl",
  "./wheels/xatlas-0.0.11-cp313-cp313-macosx_10_14_x86_64.whl",
  "./wheels/xatlas-0.0.11-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/xatlas-0.0.11-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl",
  "./wheels/xatlas-0.0.11-cp313-cp313-win_amd64.whl",
]

[permissions]
network = "Listens on 127.0.0.1 for the paired Nighty Vault plugin only"
files = "Import model files, save renders, exports and reference images"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "/tests/",
  "/scripts/",
  "*.blend1",
]
