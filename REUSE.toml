# REUSE (https://reuse.software) licensing information for files that can't carry an SPDX header.
# Everything here is GPL-3.0-or-later unless listed otherwise below. License texts: LICENSES/.
version = 1

[[annotations]]
path = [
  "addon/**", "plugin/**", "skills/**", "guides/**", "examples/**", "docs/**", "scripts/**", "tests/**",
  ".github/**", "README.md", "CHANGELOG.md", "CREDITS.md", "REUSE.toml", ".gitignore", ".gitattributes",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NightyCode"
SPDX-License-Identifier = "GPL-3.0-or-later"

# xatlas-python 0.0.11 wheels (MIT, Copyright 2021 Markus Worchel; wraps jpcy/xatlas, MIT, Copyright 2018-2020
# Jonathan Young), shipped unmodified in the add-on and installed by Blender
[[annotations]]
path = ["addon/nighty_blender/wheels/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2021 Markus Worchel", "2018-2020 Jonathan Young"]
SPDX-License-Identifier = "MIT"

# libarchive's own 7z test archive (test data only, never shipped)
[[annotations]]
path = ["tests/io/fixtures/**"]
precedence = "override"
SPDX-FileCopyrightText = "2011 Michihiro NAKAJIMA"
SPDX-License-Identifier = "BSD-2-Clause"

[[annotations]]
path = ["LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "GPL-3.0-or-later"
